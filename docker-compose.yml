# Ambiente local completo: docker compose up --build
# Dados de demonstracao: docker compose --profile demo run --rm seed
services:
  db:
    build:
      context: ./deploy/docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedu"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://wedu:wedu@db:5432/wedu
      SECRET_KEY: docker-local-only
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Contas e cursos de demonstracao (mesmos do e2e). Popula como superusuario, fora do RLS.
  seed:
    build: ./backend
    profiles: ["demo"]
    command: ["python", "scripts/seed_e2e.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wedu
      NOTIFICATION_WORKER_ENABLED: "false"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  storage:
